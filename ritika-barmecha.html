}
function migrateMeetings(list) {

  }));

function getUrgency(due) {
  if (!due) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dueDay = new Date(due + 'T00:00:00'); dueDay.setHours(0, 0, 0, 0);
  const diff = Math.round((dueDay - today) / 86400000);
  if (diff < 0)  return 'overdue';
  if (diff <= 3) return 'urgent';
  if (diff <= 7) return 'soon';
  return null;
}

/* ═══════════════════════════════════════
   PROGRESS COMPUTATION
═══════════════════════════════════════ */
function computeProgress(phases, presentations) {
  const vp     = phases.filter(p => PHASE_WEIGHTS[p.name]);
  const rawW   = vp.map(p => PHASE_WEIGHTS[p.name]);
  const totalW = rawW.reduce((s,w)=>s+w, 0);
  const normW  = rawW.map(w => w/totalW);
  let completedW=0, currentW=0, currentPct=0, foundCurrent=false;
  vp.forEach((phase, i) => {
    if (foundCurrent) return;
    if (COMPLETE_STATUSES.has(phase.status)) { completedW += normW[i]; return; }
    foundCurrent = true;
    currentW = normW[i];
    const ps = pd(phase.start), pe = new Date(pd(phase.end).getTime() + 86400000);
    const phaseEvts = presentations.filter(e => { const d=pd(e.date); return d>=ps&&d<=pe; });
    const done = phaseEvts.filter(e=>e.status==='Done'||e.status==='Received').length;
    currentPct = phaseEvts.length > 0 ? done/phaseEvts.length : 0;
  });
  return Math.round((completedW + currentW*currentPct)*100);
}

function getCurrentPhase(phases) {
  return phases.find(p => ACTIVE_STATUSES.has(p.status))
      || phases.find(p => p.status === 'Yet to begin')
      || phases[phases.length - 1];
}

function getNextMilestone(presentations) {
  const today = new Date(); today.setHours(0,0,0,0);
  return [...presentations]
    .filter(e => (e.status === 'Scheduled' || e.status === 'Pending') && pd(e.date) >= today)
    .sort((a,b) => pd(a.date)-pd(b.date))[0] || null;
}

/* ═══════════════════════════════════════
   EDITABLE TEXT (inline)
═══════════════════════════════════════ */
function EditableText({ value, onChange, style, placeholder, editMode, multiline, as:Tag='span' }) {
  const T = useContext(ThemeCtx);
  const [editing, setEditing] = useState(false);
  const [draft, setDraft]     = useState(value);
  const ref = useRef();

  useEffect(() => { setDraft(value); }, [value]);
  useEffect(() => { if (editing && ref.current) ref.current.focus(); }, [editing]);

  const save = () => { if (draft !== value) onChange(draft); setEditing(false); };
  const cancel = () => { setDraft(value); setEditing(false); };

  if (editing) {
    if (multiline) return (
      <textarea ref={ref} value={draft} onChange={e=>setDraft(e.target.value)}
        onBlur={save} onKeyDown={e=>{ if(e.key==='Escape') cancel(); }}
        style={{ ...style, border:'1.5px solid '+T.accent, borderRadius:4, padding:'4px 8px', background:T.accentBg, outline:'none', width:'100%', resize:'vertical', minHeight:60, lineHeight:1.65 }} />
    );
    return (
      <input ref={ref} type="text" value={draft} onChange={e=>setDraft(e.target.value)}
        onBlur={save} onKeyDown={e=>{ if(e.key==='Enter') save(); if(e.key==='Escape') cancel(); }}
        style={{ ...style, border:'1.5px solid '+T.accent, borderRadius:4, padding:'2px 8px', background:T.accentBg, outline:'none' }} />
    );
  }

  if (!editMode) return <Tag style={style}>{value || ''}</Tag>;

  return (
    <Tag style={{ ...style, borderBottom:`1px dashed ${T.accent}60`, cursor:'text', display:'inline' }}
      onClick={() => { setDraft(value); setEditing(true); }} title="Click to edit">
      {value || <span style={{ color:T.text3, fontStyle:'italic', fontWeight:400 }}>{placeholder || 'Click to edit'}</span>}
    </Tag>
  );
}

    <div style={{ position:'fixed', inset:0, zIndex:300, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(26,25,23,0.65)', backdropFilter:'blur(6px)', WebkitBackdropFilter:'blur(6px)' }}

        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:24 }}>
          <div style={{ fontFamily:T.serif, fontSize:18, fontWeight:500, color:T.text1 }}>{modal.isNew ? `Add ${label}` : `Edit ${label}`}</div>
          <button onClick={onClose} style={{ background:'none', border:'none', cursor:'pointer', color:T.text3, fontSize:20, padding:'0 2px', lineHeight:1 }}>✕</button>
        </div>

        {renderForm()}

        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:24, paddingTop:20, borderTop:`1px solid ${T.borderHair}` }}>
          {!modal.isNew && onDelete ? (
            <button onClick={() => { if(window.confirm('Remove this item?')) onDelete(draft); }}
              style={{ background:'none', border:`1px solid #B24B4340`, borderRadius:6, padding:'8px 14px', color:'#B24B43', fontSize:11, fontWeight:600, cursor:'pointer', letterSpacing:'0.04em' }}>

            </button>
          ) : <div/>}

            <button onClick={onClose}
              style={{ background:T.bg, border:`1px solid ${T.border}`, borderRadius:6, padding:'8px 18px', color:T.text2, fontSize:11, fontWeight:600, cursor:'pointer' }}>
              Cancel
            </button>

              {modal.isNew ? 'Add' : 'Save'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function parseMeetingForView(m) {
  const decisions = (m.decisions||'').split('\n').filter(Boolean);
  const teamItems = (m.teamItems||'').split('\n').filter(Boolean).map(line => {
    const done = line.includes('[done]');
    const clean = line.replace('[done]','').trim();
    const colonIdx = clean.indexOf(':');
    const who  = colonIdx > -1 ? clean.slice(0, colonIdx).trim() : '';
    const task = colonIdx > -1 ? clean.slice(colonIdx+1).trim() : clean;
    return { who, task, done };
  });
  const clientItems = (m.clientItems||'').split('\n').filter(Boolean).map(line => {
    const done = line.includes('[done]');
    const task = line.replace('[done]','').trim();
    return { task, done };
  });
  return { decisions, teamItems, clientItems };
}

  const [team,          setTeam]          = useState(INITIAL_TEAM);
  const [presentations, setPresentations] = useState(INITIAL_PRESENTATIONS);
  const [meetings,      setMeetings]      = useState(INITIAL_MEETINGS);
  const [deliverables,  setDeliverables]  = useState(INITIAL_DELIVERABLES);
  const [deps,          setDeps]          = useState(INITIAL_DEPS);
  const [links,         setLinks]         = useState(INITIAL_LINKS);
  const [calBands,      setCalBands]      = useState(INITIAL_CAL_BANDS);
  const [calMonth,      setCalMonth]      = useState(() => {
    const d = new Date(); d.setDate(1); d.setHours(0,0,0,0);
    const s = pd(INITIAL_PROJECT.startDate), e = pd(INITIAL_PROJECT.endDate);
    const c = d < s ? s : d > e ? e : d;
    return new Date(c.getFullYear(), c.getMonth(), 1);
  });

  const [editMode,      setEditMode]      = useState(false);
  const [editModal,     setEditModal]     = useState(null);
  const [activeMeeting, setActiveMeeting] = useState(null);
  const [expandedDep,   setExpandedDep]   = useState(null);

  const [showPasscode, setShowPasscode]     = useState(false);
  const [passcodeVal,  setPasscodeVal]      = useState('');
  const [passcodeErr,  setPasscodeErr]      = useState(false);

  const submitPasscode = () => {
    if (passcodeVal === EDIT_PASSCODE) {
      setEditMode(true); setShowPasscode(false); setPasscodeVal(''); setPasscodeErr(false);
    } else {
      setPasscodeErr(true);
    }
  };

  // NEW: Dual theme
  const [isDark, setIsDark] = useState(false);
  const T = isDark ? DARK : LIGHT;

  // NEW: Timeline expansion
  const [activePhase, setActivePhase] = useState(null);

  // NEW: Meeting tabs
  const [meetingTab, setMeetingTab] = useState('upcoming');

  // NEW: Past meetings show-all
  const [showAllPast, setShowAllPast] = useState(false);

  // NEW: Deliverable groups open/closed
  const [openGroups, setOpenGroups] = useState({});

  /* ── LOAD + PERSIST  (JSONbin shared state, localStorage fallback) ── */
  const [loading, setLoading] = useState(JSONBIN_OK);
  const canSave = useRef(false);

  // Update body bg/color when theme changes
  useEffect(() => {
    document.body.style.background = T.bg;
    document.body.style.color = T.text1;
  }, [isDark]);

  useEffect(() => {
    // No backend → restore from localStorage and continue
    if (!JSONBIN_OK) {
      try {
        if (localStorage.getItem('rb_version') === String(DATA_VERSION)) {
          const r = (k, set, migrate) => { const v = localStorage.getItem(k); if (v) set(migrate ? migrate(JSON.parse(v)) : JSON.parse(v)); };
          r('rb_project',       setProject);
          r('rb_phases',        setPhases);
          r('rb_team',          setTeam);
          r('rb_presentations', setPresentations, migratePresentations);
          r('rb_meetings',      setMeetings,      migrateMeetings);
          r('rb_deliverables',  setDeliverables,  migrateDeliverables);
          r('rb_deps',          setDeps,  migrateDeps);
          r('rb_links',         setLinks);
          r('rb_cal_bands',     setCalBands);
        }
      } catch {}
      canSave.current = true;
      return;
    }
    // Backend → fetch latest snapshot
    const loadStart = Date.now();
    const MIN_LOADER_MS = 2000;
    (async () => {
      try {
        const res = await fetch(
          `https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`,
          { headers: { 'X-Master-Key': JSONBIN_KEY } }
        );
        if (res.ok) {
          const { record } = await res.json();
          if (record.project)               setProject(record.project);
          if (record.phases?.length)        setPhases(record.phases);
          if (record.team?.length)          setTeam(record.team);
          if (record.presentations?.length) setPresentations(migratePresentations(record.presentations));
          if (record.meetings?.length)      setMeetings(migrateMeetings(record.meetings));
          if (record.deliverables?.length)  setDeliverables(migrateDeliverables(record.deliverables));
          if (record.deps?.length)          setDeps(migrateDeps(record.deps));
          if (record.links?.length)         setLinks(record.links);
          if (Array.isArray(record.calBands)) setCalBands(record.calBands);
        }
      } catch (err) {
        console.warn('Ritika Barmecha portal: JSONbin load failed; falling back to defaults', err);
      }
      const elapsed = Date.now() - loadStart;
      setTimeout(() => setLoading(false), Math.max(0, MIN_LOADER_MS - elapsed));
      canSave.current = true;
    })();
  }, []);

  useEffect(() => {
    if (!canSave.current) return;
    // localStorage mirror (always)
    try {
      localStorage.setItem('rb_version',       String(DATA_VERSION));
      localStorage.setItem('rb_project',       JSON.stringify(project));
      localStorage.setItem('rb_phases',        JSON.stringify(phases));
      localStorage.setItem('rb_team',          JSON.stringify(team));
      localStorage.setItem('rb_presentations', JSON.stringify(presentations));
      localStorage.setItem('rb_meetings',      JSON.stringify(meetings));
      localStorage.setItem('rb_deliverables',  JSON.stringify(deliverables));
      localStorage.setItem('rb_deps',          JSON.stringify(deps));
      localStorage.setItem('rb_links',         JSON.stringify(links));
      localStorage.setItem('rb_cal_bands',     JSON.stringify(calBands));
    } catch {}
    if (!JSONBIN_OK) return;
    // Debounced PUT to avoid spamming JSONbin during rapid edits
    const tid = setTimeout(() => {
      fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
        method:  'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
        body:    JSON.stringify({
          version: DATA_VERSION,
          project, phases, team, presentations,
          meetings, deliverables, deps, links, calBands,
        }),
      }).catch(err => console.warn('Ritika Barmecha portal: JSONbin save failed', err));
    }, 600);
    return () => clearTimeout(tid);
  }, [project, phases, team, presentations, meetings, deliverables, deps, links, calBands]);

  /* ── DERIVED PHASE STATUS + DISPLAY DATE ───────────────────────────────
     Three signals combined; highest level wins (phases never downgraded).
     Meetings are matched by TITLE KEYWORDS so rescheduled dates still link
     correctly. displayStart is set from the earliest keyword-matched meeting
     so the phase node shows the real meeting date, not the stale stored date.

     Level scale:
       0  Yet to begin / On hold
       1  Kick-off  (meeting Scheduled)
       2  In Progress  (deliverable active/done · meeting Done · milestone Done)
       3  Awaiting Feedback  (milestone Scheduled)
       5  Submitted — Handover remaining
       6  Handover Complete  (all phase deliverables done)
  ─────────────────────────────────────────────────────────────────────── */
  /* ── DERIVED MILESTONES ─────────────────────────────────────────────
     Milestones (presentations, e.g. "ms1") and meetings (e.g. "m1") are
     tracked as separate records but represent the same real-world event,
     linked here by matching numeric ID suffix (ms1 ↔ m1, ms2 ↔ m2, ...).
     Matching by ID rather than date means a rescheduled meeting still
     resolves correctly — the milestone's date AND status follow the
     meeting automatically, so the "Next" banner never shows a stale date.
  ─────────────────────────────────────────────────────────────────────── */
  const effectivePresentations = useMemo(() => {
    return presentations.map(p => {
      const n = p.id.match(/^ms(\d+)$/)?.[1];
      const linked = n ? meetings.find(m => m.id === 'm' + n) : null;
      if (!linked) return p;
      const status = linked.status === 'Done' ? 'Done' : linked.status === 'Scheduled' ? 'Scheduled' : 'Pending';
      const date = linked.date || p.date;
      return (status !== p.status || date !== p.date) ? { ...p, status, date } : p;
    });
  }, [presentations, meetings]);

  const effectivePhases = useMemo(() => {
    const lvl = s => ({
      'Yet to begin':0, 'On hold':0,
      'Kick-off':1, 'Research':1,
      'In Progress':2, 'Design – In Progress':2, 'In Development':2,
      'Awaiting Content':3, 'Presentation scheduled':3, 'Awaiting Feedback':3,
      'Refining basis feedback':4, 'Creating Print ready files':4,
      'Submitted - Handover remaining':5,
      'Handover Complete':6, 'Complete':7,
    }[s] ?? 0);

    return phases.map(phase => {
      let best         = phase.status; // start from manually-stored status
      let displayStart = null;         // overrides shown date if meetings found

      // ── 1. Deliverables ────────────────────────────────────────────
      {
        const dels = deliverables.filter(d => d.phase === phase.name);
        if (dels.length > 0) {
          const allDone   = dels.every(d => getStatusGroup(d.status) === 'done');
          const anyActive = dels.some(d =>  getStatusGroup(d.status) === 'active');
          const anyDone   = dels.some(d =>  getStatusGroup(d.status) === 'done');
          const candidate = allDone ? 'Handover Complete'
                          : (anyActive || anyDone) ? 'In Progress'
                          : 'Yet to begin';
          if (lvl(candidate) > lvl(best)) best = candidate;
        }
      }

      // ── 2. Meetings — keyword-matched (primary) or date range (fallback) ─
      const keyMtgs = meetings.filter(m => meetingPhaseId(m) === phase.id);
      const origPs  = pd(phase.start);
      const origPe  = new Date(pd(phase.end).getTime() + 86400000);
      const rangeMtgs = meetings.filter(m => { const d = pd(m.date); return d >= origPs && d <= origPe; });
      const phaseMtgs = keyMtgs.length > 0 ? keyMtgs : rangeMtgs;

      if (phaseMtgs.length > 0) {
        // Derive displayStart from earliest matched meeting
        const earliest = [...phaseMtgs].sort((a,b) => pd(a.date)-pd(b.date))[0].date;
        displayStart = earliest;
        if (phaseMtgs.some(m => m.status === 'Done')      && lvl('In Progress') > lvl(best)) best = 'In Progress';
        if (phaseMtgs.some(m => m.status === 'Scheduled') && lvl('Kick-off')    > lvl(best)) best = 'Kick-off';
      }

      // ── 3. Milestone presentations — always use original date range ─
      const phasePres = effectivePresentations.filter(e => { const d = pd(e.date); return d >= origPs && d <= origPe; });
      if (phasePres.some(e => e.status === 'Done')      && lvl('In Progress')           > lvl(best)) best = 'In Progress';
      if (phasePres.some(e => e.status === 'Scheduled') && lvl('Presentation scheduled') > lvl(best)) best = 'Presentation scheduled';

      const changed = best !== phase.status || displayStart !== null;
      return changed
        ? { ...phase, status: best, ...(displayStart ? { displayStart } : {}) }
        : phase;
    });

  const clientSt        = currentPhase ? (INTERNAL_TO_CLIENT[currentPhase.status] || 'In Progress') : 'In Progress';
  const clientPhaseName = currentPhase ? (currentPhase.clientName || currentPhase.name) : '';
  const nextMilestone   = getNextMilestone(effectivePresentations);
  const pendingDeps     = deps.filter(d => d.status !== 'Completed').length;
  const today0 = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
  const upcomingMeetings = meetings.filter(m => m.status !== 'Done' && pd(m.date) >= today0).sort((a,b) => pd(a.date)-pd(b.date));
  const pastMeetings     = meetings.filter(m => m.status === 'Done'  || pd(m.date) < today0).sort((a,b) => pd(b.date)-pd(a.date));

  function saveEdit(draft) {
    if (!editModal) return;
    const { type, isNew } = editModal;
    const withId = isNew ? { ...draft, id: type + uid() } : draft;
    if (type === 'phase')       { isNew ? setPhases(p=>[...p,withId])       : setPhases(p=>p.map(x=>x.id===draft.id?draft:x)); }
    else if (type === 'team')   { const { _custom, ...m } = withId; isNew ? setTeam(p=>[...p,m]) : setTeam(p=>p.map(x=>x.id===m.id?m:x)); }
    else if (type === 'meeting'){
      isNew ? setMeetings(p=>[...p,withId]) : setMeetings(p=>p.map(x=>x.id===draft.id?draft:x));
      // Sync linked milestone (m1↔ms1, m2↔ms2, ...) — write date+status back to presentations state
      if (!isNew) {
        const n = draft.id.match(/^m(\d+)$/)?.[1];
        if (n) {
          const msStatus = draft.status === 'Done' ? 'Done' : draft.status === 'Scheduled' ? 'Scheduled' : 'Pending';
          setPresentations(p => p.map(x => x.id === 'ms'+n ? { ...x, date: draft.date || x.date, status: msStatus } : x));
        }
      }
    }
    else if (type === 'deliverable'){ isNew ? setDeliverables(p=>[...p,withId]) : setDeliverables(p=>p.map(x=>x.id===draft.id?draft:x)); }
    else if (type === 'dep')    { isNew ? setDeps(p=>[...p,withId])         : setDeps(p=>p.map(x=>x.id===draft.id?draft:x)); }
    else if (type === 'calband'){ isNew ? setCalBands(p=>[...p,withId])     : setCalBands(p=>p.map(x=>x.id===draft.id?draft:x)); }
    else if (type === 'link')   {
      if (isNew) { setLinks(p=>p.map(folder=>folder.id===draft._folderId ? { ...folder, subFolders:[...folder.subFolders, withId] } : folder)); }
      else { setLinks(p=>p.map(folder=>({ ...folder, subFolders: folder.subFolders.map(sf=>sf.id===draft.id?{...draft}:sf) }))); }
    }
    setEditModal(null);
  }

  function deleteEdit(draft) {
    const { type } = editModal;
    if (type === 'phase')       setPhases(p=>p.filter(x=>x.id!==draft.id));
    else if (type === 'team')   setTeam(p=>p.filter(x=>x.id!==draft.id));
    else if (type === 'meeting')setMeetings(p=>p.filter(x=>x.id!==draft.id));
    else if (type === 'deliverable') setDeliverables(p=>p.filter(x=>x.id!==draft.id));
    else if (type === 'dep')    setDeps(p=>p.filter(x=>x.id!==draft.id));
    else if (type === 'calband')setCalBands(p=>p.filter(x=>x.id!==draft.id));
    else if (type === 'link')   setLinks(p=>p.map(folder=>({ ...folder, subFolders: folder.subFolders.filter(sf=>sf.id!==draft.id) })));
    setEditModal(null);
  }

  const openAdd  = (type, def)  => setEditModal({ type, item: def, isNew: true });

  function shiftPhaseDates(phase, diff) {
    if (!diff) return;
    const ps = pd(phase.start), pe = new Date(pd(phase.end).getTime() + 86400000);
    setDeliverables(list => list.map(d => d.phase === phase.name && d.due ? { ...d, due: addDays(d.due, diff) } : d));
    setMeetings(list => list.map(m => meetingPhaseId(m) === phase.id ? { ...m, date: addDays(m.date, diff) } : m));
    setPresentations(list => list.map(p => { const dt = pd(p.date); return (dt >= ps && dt <= pe) ? { ...p, date: addDays(p.date, diff) } : p; }));
    setDeps(list => list.map(d => { if (!d.due) return d; const dt = pd(d.due); return (dt >= ps && dt <= pe) ? { ...d, due: addDays(d.due, diff) } : d; }));
  }

  const cycleStatus = (d) => {
    const idx  = STATUS_CYCLE.indexOf(d.status);
    const next = STATUS_CYCLE[idx === -1 || idx === STATUS_CYCLE.length - 1 ? 0 : idx + 1];
    setDeliverables(p => p.map(x => x.id === d.id ? { ...x, status: next } : x));
  };

  const movePhase = (id, dir) => {
    setPhases(prev => {
      const idx = prev.findIndex(p => p.id === id);
      if (dir === 'left' && idx === 0) return prev;
      if (dir === 'right' && idx === prev.length - 1) return prev;
      const next = [...prev];
      const swap = dir === 'left' ? idx - 1 : idx + 1;
      [next[idx], next[swap]] = [next[swap], next[idx]];
      return next;
    });
  };

  const moveDeliverable = (id, dir) => {
    setDeliverables(prev => {
      const idx = prev.findIndex(d => d.id === id);
      if (dir === 'up' && idx === 0) return prev;
      if (dir === 'down' && idx === prev.length - 1) return prev;
      const next = [...prev];
      const swap = dir === 'up' ? idx - 1 : idx + 1;
      [next[idx], next[swap]] = [next[swap], next[idx]];
      return next;
    });
  };

  // Build deliverable phase groups — always show all phases in order
  const validPhaseNames = phases.map(p => p.name);
  const phaseGroupOrder = [...validPhaseNames];
  const phaseGroupMap = {};
  validPhaseNames.forEach(n => { phaseGroupMap[n] = []; });
  deliverables.forEach(d => {
    // If phase is valid, use it; otherwise assign by due date falling within a phase range
    let pk = validPhaseNames.includes(d.phase) ? d.phase : null;
    if (!pk && d.due) {
      const due = pd(d.due);
      pk = phases.find(p => due >= pd(p.start) && due <= pd(p.end))?.name || null;
    }
    pk = pk || validPhaseNames[0] || 'Deliverables';
    if (!phaseGroupMap[pk]) { phaseGroupMap[pk] = []; phaseGroupOrder.push(pk); }
    phaseGroupMap[pk].push(d);
  });

    const init = {};
    phaseGroupOrder.forEach(p => { init[p] = false; });
    setOpenGroups(init);
  }, []);

                            {editMode && <EditBadge onClick={() => openEdit('meeting', m)} />}
                          </div>
                        ))}
                      </div>

                  )}

                  {/* Key outputs */}
                  {phase.keyOutputs && phase.keyOutputs.length > 0 && (
                    <div>
                      <div style={{ fontFamily:T.sans, fontSize:8, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:T.text3, marginBottom:6 }}>Key Outputs</div>
                      <div style={{ display:'flex', gap:5, flexWrap:'wrap' }}>
                        {phase.keyOutputs.map((o,j) => (
                          <span key={j} style={{ fontFamily:T.sans, fontSize:9, color:color, background:light, padding:'3px 9px', borderRadius:3, border:`1px solid ${color}22` }}>{o}</span>
                        ))}

                    </div>

                </div>
              </div>
            );
          })()}
        </section>

        {/* ════════════════════════════════
            TEAM (id="team")
        ════════════════════════════════ */}
        <section id="team" style={{ paddingTop:48, paddingBottom:48, borderBottom:`1px solid ${T.borderHair}` }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:28 }}>
            <div style={{ fontFamily:T.sans, fontSize:8, fontWeight:700, letterSpacing:'0.22em', textTransform:'uppercase', color:T.text3 }}>Project Team</div>
            {editMode && <button className="add-btn" style={{ border:`1px dashed ${T.accent}70`, color:T.accent, padding:'5px 12px', marginTop:0 }} onClick={() => openAdd('team', { name:'', role:'', responsibility:'' })}>+ Add Member</button>}
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(200px, 1fr))', gap:'0 40px' }}>
            {team.map((member, i) => (
              <div key={member.id} className="edit-row" style={{ padding:'20px 0', position:'relative' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:12 }}>
                  <div style={{ width:32, height:32, borderRadius:'50%', background:T.accentBg, display:'flex', alignItems:'center', justifyContent:'center' }}>
                    <span style={{ fontFamily:T.serif, fontSize:13, fontWeight:500, color:T.accent }}>{member.name.charAt(0)}</span>
                  </div>
                  {editMode && <EditBadge onClick={() => openEdit('team', member)} />}
                </div>
                <div style={{ fontFamily:T.sans, fontSize:13, fontWeight:600, color:T.text1, marginBottom:3 }}>{member.name}</div>
                <div style={{ fontFamily:T.sans, fontSize:8, fontWeight:700, color:T.accent, letterSpacing:'0.06em', textTransform:'uppercase', marginBottom:8 }}>{member.role}</div>
                {member.responsibility && <div style={{ fontFamily:T.sans, fontSize:11, color:T.text2, lineHeight:1.6 }}>{member.responsibility}</div>}
              </div>
            ))}
          </div>
        </section>

        {/* ════════════════════════════════
            CALENDAR (id="calendar")
        ════════════════════════════════ */}
        <section id="calendar" style={{ paddingTop:48, paddingBottom:48, borderBottom:`1px solid ${T.borderHair}` }}>
          {(() => {
            const today      = new Date(); today.setHours(0,0,0,0);
            const year       = calMonth.getFullYear();
            const month      = calMonth.getMonth();
            const daysInMonth= new Date(year, month+1, 0).getDate();
            const firstDow   = new Date(year, month, 1).getDay();
            const cells      = [...Array(firstDow).fill(null), ...Array.from({length:daysInMonth},(_,i)=>i+1)];
            while (cells.length % 7 !== 0) cells.push(null);
            const weeks = [];
            for (let i=0; i<cells.length; i+=7) weeks.push(cells.slice(i,i+7));
            const fmt2   = n => String(n).padStart(2,'0');
            const toDate = d => d ? `${year}-${fmt2(month+1)}-${fmt2(d)}` : null;
            const prevMonth = new Date(year, month-1, 1);
            const nextMonth = new Date(year, month+1, 1);
            const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const DEP_COLOR = '#C4894A';

            const byDay = (list, key) => { const o = {}; list.forEach(x => { if (x[key]) (o[x[key]] = o[x[key]]||[]).push(x); }); return o; };
            const mtgByDay  = byDay(meetings, 'date');
            const delByDay  = byDay(deliverables, 'due');
            const depByDay  = byDay(deps, 'due');
            // Milestones with no meeting on the same day (e.g. documents to be emailed)
            const msByDay   = byDay(effectivePresentations.filter(p => !mtgByDay[p.date]), 'date');

            const bands = [
              ...effectivePhases.filter(p => p.start && p.end).map(p => ({ id:'ph_'+p.id, phaseId:p.id, label:p.clientName || p.name, start:p.start, end:p.end, color:p.color || T.accent })),
              ...calBands.filter(b => b.start && b.end && b.label),
            ];
            const editBand = b => {
              if (!editMode) return;
              if (b.phaseId) { const ph = phases.find(x => x.id === b.phaseId); if (ph) openEdit('phase', ph); }
              else openEdit('calband', b);
            };
            const done = s => ['Delivered','Approved','Finalised','Completed','Done'].includes(s);
            const chip = (key, label, { filled, color, isDone, onClick, title }) => (
              <div key={key} onClick={onClick} title={title || label} style={{
                background: isDone ? T.bgAlt : filled ? color : color + '14',
                color:      isDone ? T.text3 : filled ? '#fff' : color,
                border:     isDone ? `1px solid ${T.border}` : filled ? 'none' : `1px solid ${color}55`,
                opacity:    isDone ? 0.6 : 1,
                textDecoration: isDone ? 'line-through' : 'none',
                borderRadius:3, padding:'3px 6px', marginBottom:3,
                fontFamily:T.sans, fontSize:8, fontWeight:600, lineHeight:1.3,
                cursor: onClick ? 'pointer' : 'default',
              }}><span style={{ overflow:'hidden', display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', wordBreak:'break-word' }}>{label}</span></div>
            );
            const LegendDot = ({ color, label, filled }) => (
              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                <div style={{ width:10, height:10, borderRadius:2, background: filled ? color : color+'22', border: filled ? 'none' : `1px solid ${color}88` }} />
                <span style={{ fontFamily:T.sans, fontSize:9, color:T.text2 }}>{label}</span>
              </div>
            );

            return (
              <div>
                <div style={{ fontFamily:T.sans, fontSize:8, fontWeight:700, letterSpacing:'0.22em', textTransform:'uppercase', color:T.text3, marginBottom:20 }}>Calendar</div>
                {/* Nav row */}
                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:12, marginBottom:20 }}>
                  <div style={{ display:'flex', alignItems:'center', gap:14 }}>
                    <button onClick={() => setCalMonth(prevMonth)}
                      style={{ background:'none', border:`1px solid ${T.border}`, borderRadius:6, width:30, height:30, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:T.text1, fontSize:15 }}>‹</button>
                    <span style={{ fontFamily:T.serif, fontSize:24, fontWeight:500, color:T.text1, minWidth:200 }}>
                      {calMonth.toLocaleString('en',{month:'long', year:'numeric'})}
                    </span>
                    <button onClick={() => setCalMonth(nextMonth)}
                      style={{ background:'none', border:`1px solid ${T.border}`, borderRadius:6, width:30, height:30, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:T.text1, fontSize:15 }}>›</button>
                  </div>
                  <div style={{ display:'flex', gap:8, alignItems:'center' }}>
                    <button onClick={() => setCalMonth(new Date(today.getFullYear(), today.getMonth(), 1))}
                      style={{ background:'none', border:`1px solid ${T.border}`, borderRadius:20, padding:'5px 14px', fontFamily:T.sans, fontSize:8, fontWeight:600, color:T.text2, cursor:'pointer', letterSpacing:'0.06em' }}>
                      Today
                    </button>
                    {editMode && (
                      <button className="add-btn" onClick={() => openAdd('calband', { label:'', start:'', end:'', color:BAND_COLORS[0] })}
                        style={{ border:`1px dashed ${T.accent}70`, color:T.accent, padding:'5px 12px' }}>
                        + Add Band
                      </button>
                    )}
                  </div>
                </div>

                {/* Legend */}
                <div style={{ display:'flex', flexWrap:'wrap', gap:14, marginBottom:18 }}>
                  <LegendDot color={T.accent} label="Meeting / Presentation" filled />
                  <LegendDot color={T.accent} label="Milestone" />
                  <LegendDot color={T.text2}  label="Deliverable due" />
                  <LegendDot color={DEP_COLOR} label="Client input due" />
                  {bands.map(b => (
                    <div key={b.id} style={{ display:'flex', alignItems:'center', gap:6 }}>
                      <div style={{ width:10, height:10, borderRadius:'50%', background:b.color }} />
                      <span style={{ fontFamily:T.sans, fontSize:9, color:T.text2 }}>{b.label}</span>
                    </div>
                  ))}
                </div>

                {/* Grid */}
                <div style={{ border:`1px solid ${T.border}`, borderRadius:6, overflow:'hidden' }}>
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(7,minmax(0,1fr))', background:T.bgAlt, borderBottom:`1px solid ${T.border}` }}>
                    {DOW.map(d => (
                      <div key={d} style={{ padding:'9px 10px', fontFamily:T.sans, fontSize:8, fontWeight:700, letterSpacing:'0.14em', textTransform:'uppercase', color:T.text3 }}>{d}</div>
                    ))}
                  </div>

                  {weeks.map((week, wi) => {
                    const weekStart = toDate(week.find(d=>d));
                    const weekEnd   = toDate([...week].reverse().find(d=>d));
                    const activeBands = bands.filter(b => weekStart && weekEnd && b.start <= weekEnd && b.end >= weekStart);
                    return (
                      <div key={wi} style={{ borderBottom: wi < weeks.length-1 ? `1px solid ${T.border}` : 'none' }}>
                        {/* Band rows — non-overlapping bands share a lane */}
                        {(() => {
                          const lanes = [];
                          activeBands.map(b => {
                            let startCol = 7, endCol = -1;
                            week.forEach((day, di) => {
                              const ds = toDate(day);
                              if (ds && ds >= b.start && ds <= b.end) { startCol = Math.min(startCol, di); endCol = Math.max(endCol, di); }
                            });
                            return { b, startCol, endCol };
                          }).filter(x => x.endCol >= 0).sort((x, y) => x.startCol - y.startCol).forEach(x => {
                            const lane = lanes.find(l => l[l.length-1].endCol < x.startCol);
                            lane ? lane.push(x) : lanes.push([x]);
                          });
                          return lanes.map((lane, li) => (
                            <div key={li} style={{ position:'relative', height:26, borderBottom:`1px solid ${T.borderHair}`, background:T.surface }}>
                              {lane.map(({ b, startCol, endCol }) => {
                          const leftPct  = (startCol / 7 * 100).toFixed(2);
                          const widthPct = ((endCol - startCol + 1) / 7 * 100).toFixed(2);
                          const isFirstWeek = b.start >= weekStart;
                          const isLastWeek  = b.end   <= weekEnd;
                          return (
                              <div key={b.id} onClick={() => editBand(b)} style={{
                                position:'absolute', top:4, bottom:4, cursor: editMode ? 'pointer' : 'default',
                                left:`calc(${leftPct}% + 4px)`, width:`calc(${widthPct}% - 8px)`,
                                background: b.color + '22', border:`1.5px solid ${b.color}66`,
                                borderRadius:`${isFirstWeek?5:0}px ${isLastWeek?5:0}px ${isLastWeek?5:0}px ${isFirstWeek?5:0}px`,
                                display:'flex', alignItems:'center', gap:7, paddingLeft:8, paddingRight:8,
                              }}>
                                <div style={{ width:7, height:7, borderRadius:'50%', background:b.color, flexShrink:0 }} />
                                <span style={{ fontFamily:T.sans, fontSize:9, fontWeight:600, color:b.color, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', flex:1 }}>
                                  {isFirstWeek || toDate(week[startCol]) === weekStart ? b.label : ''}
                                </span>
                                {editMode && <span style={{ fontFamily:T.sans, fontSize:7, color:b.color, opacity:0.6 }}>✏</span>}
                              </div>
                          );
                              })}
                            </div>
                          ));
                        })()}

                        {/* Day cells */}
                        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,minmax(0,1fr))' }}>
                          {week.map((day, di) => {
                            const ds      = toDate(day);
                            const dayMtgs = ds ? (mtgByDay[ds]||[]) : [];
                            const dayMs   = ds ? (msByDay[ds]||[])  : [];
                            const dayDels = ds ? (delByDay[ds]||[]) : [];
                            const dayDeps = ds ? (depByDay[ds]||[]) : [];
                            const isToday = day && today.getFullYear()===year && today.getMonth()===month && today.getDate()===day;
                            return (
                              <div key={di} style={{
                                minHeight:96, padding:'8px 6px', minWidth:0,
                                borderRight: di < 6 ? `1px solid ${T.border}` : 'none',
                                background: isToday ? T.accentBg : !day ? T.bgAlt : T.surface,
                                opacity: !day ? 0.5 : 1,
                              }}>
                                {day && (
                                  <>
                                    <div style={isToday ? {
                                      width:22, height:22, borderRadius:'50%', background:T.accent,
                                      display:'flex', alignItems:'center', justifyContent:'center',
                                      fontFamily:T.sans, fontSize:10, fontWeight:700, color:'#fff', marginBottom:6,
                                    } : {
                                      fontFamily:T.sans, fontSize:11, fontWeight:500, color:T.text3, marginBottom:4, paddingLeft:2,
                                    }}>{day}</div>
                                    {dayMtgs.map(m => chip(m.id, m.title, { filled:true, color:T.accent, isDone:m.status==='Done', onClick:() => setActiveMeeting(m) }))}
                                    {dayMs.map(p => chip(p.id, p.notes, { color:T.accent, isDone:p.status==='Done' || p.status==='Received' }))}
                                    {dayDels.length === 1
                                      ? chip(dayDels[0].id, '◆ ' + dayDels[0].name, { color:T.text2, isDone:done(dayDels[0].status), onClick: editMode ? () => openEdit('deliverable', dayDels[0]) : undefined })
                                      : dayDels.length > 1 && chip('dels_'+ds, `◆ ${dayDels.length} deliverables due`, {
                                          color:T.text2, isDone:dayDels.every(d => done(d.status)),
                                          title: dayDels.map(d => `• ${d.name} — ${d.status}`).join('\n'),
                                          onClick: () => document.getElementById('deliverables')?.scrollIntoView({ behavior:'smooth', block:'start' }),
                                        })}
                                    {dayDeps.map(d => chip(d.id, 'Client: ' + d.title, { color:DEP_COLOR, isDone:d.status==='Completed', onClick: editMode ? () => openEdit('dep', d) : undefined }))}
                                  </>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })()}
        </section>

        {/* ════════════════════════════════
            MEETINGS (id="meetings")
        ════════════════════════════════ */}
        <section id="meetings" style={{ paddingTop:48, paddingBottom:48, borderBottom:`1px solid ${T.borderHair}` }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
            <div style={{ fontFamily:T.sans, fontSize:8, fontWeight:700, letterSpacing:'0.22em', textTransform:'uppercase', color:T.text3 }}>Meetings &amp; Presentations</div>
            {editMode && <button className="add-btn" style={{ border:`1px dashed ${T.accent}70`, color:T.accent, padding:'5px 12px', marginTop:0 }} onClick={() => openAdd('meeting', { title:'', date:'', time:'', type:'Presentation', status:'Pending', gmeetLink:'', notesLink:'', pdfData:'', pdfName:'', summary:'', decisions:'', teamItems:'', clientItems:'' })}>+ Add Meeting</button>}
          </div>

          {/* Tab bar */}
          <div style={{ display:'flex', gap:20, borderBottom:`1px solid ${T.borderHair}`, marginBottom:24 }}>
            {[['upcoming','Upcoming'],['past','Past']].map(([key, label]) => (
              <button key={key}
                onClick={() => setMeetingTab(key)}
                style={{
                  background:'none', border:'none', cursor:'pointer',
                  fontFamily:T.sans, fontSize:9, fontWeight:600,
                  color: meetingTab === key ? T.text1 : T.text3,
                  paddingBottom:10, paddingTop:2,
                  borderBottom: meetingTab === key ? `1.5px solid ${T.accent}` : '1.5px solid transparent',
                  transition:'color 0.15s, border-color 0.15s',
                  letterSpacing:'0.04em',
                }}>
                {label} {key === 'upcoming' ? `(${upcomingMeetings.length})` : `(${pastMeetings.length})`}
              </button>
            ))}
          </div>

          {meetingTab === 'upcoming' && (
            <div>
              {upcomingMeetings.length === 0 && (
                <div style={{ fontFamily:T.sans, fontSize:12, color:T.text3, padding:'16px 0' }}>No upcoming meetings scheduled.</div>
              )}
              {upcomingMeetings.map((m, i) => (
                <div key={m.id} className="edit-row accordion-row"
                  onClick={() => !editMode && setActiveMeeting(m)}
                  style={{
                    display:'flex', gap:16, alignItems:'center', padding:'14px 0',
                    borderBottom: i < upcomingMeetings.length - 1 ? `1px solid ${T.borderHair}` : 'none',
                    cursor: editMode ? 'default' : 'pointer',
                  }}
                  onMouseEnter={e=>{ if(!editMode) e.currentTarget.style.background=T.bgAlt; }}
                  onMouseLeave={e=>{ e.currentTarget.style.background='transparent'; }}>
                  {/* Date badge */}
                  <div style={{ flexShrink:0, width:36, textAlign:'center' }}>
                    <div style={{ fontFamily:T.serif, fontSize:16, fontWeight:500, color:T.accent, lineHeight:1 }}>{pd(m.date).getDate()}</div>
                    <div style={{ fontFamily:T.sans, fontSize:7, color:T.text3, textTransform:'uppercase', letterSpacing:'0.1em', marginTop:2 }}>{pd(m.date).toLocaleString('en',{month:'short'})}</div>
                  </div>
                  {/* Content */}
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontFamily:T.sans, fontSize:13, fontWeight:600, color:T.text1 }}>{m.title}</div>
                    <div style={{ fontFamily:T.sans, fontSize:9, color:T.text3, marginTop:2 }}>{m.type}{m.time ? ` · ${m.time}` : ''}</div>
                  </div>
                  {/* Right */}
                  <div style={{ display:'flex', gap:8, alignItems:'center', flexShrink:0 }}>
                    {m.paymentDue && (
                      <span style={{ display:'inline-flex', alignItems:'center', gap:4, padding:'3px 8px', borderRadius:3, fontSize:7, fontWeight:700, letterSpacing:'0.08em', textTransform:'uppercase', color:'#7B4F1A', background:'#FDF0DC', border:'1px solid #C9A96E60', whiteSpace:'nowrap', fontFamily:T.sans }}>
                        💳 Payment Due
                      </span>
                    )}
                    {m.inPerson && (
                      <span style={{ padding:'4px 10px', background:'#FAF0E6', color:'#8A5A2A', borderRadius:3, fontSize:8, fontWeight:700, fontFamily:T.sans, letterSpacing:'0.06em', border:'1px solid #EAD2B0', whiteSpace:'nowrap' }}>
                        📍 In-Person
                      </span>
                    )}
                    {m.gmeetLink && (
                      <a href={m.gmeetLink} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()}
                        style={{ padding:'4px 10px', background:m.gmeetLink.includes('zoom.us')?'#EBF5FB':'#F0FAF0', color:m.gmeetLink.includes('zoom.us')?'#1A6B9A':'#2E7D32', borderRadius:3, fontSize:8, fontWeight:700, fontFamily:T.sans, letterSpacing:'0.06em', textDecoration:'none', border:`1px solid ${m.gmeetLink.includes('zoom.us')?'#BEE3F8':'#C8E6C9'}`, whiteSpace:'nowrap' }}>
                        {m.gmeetLink.includes('zoom.us') ? 'Join Zoom' : 'Join Meet'}
                      </a>
                    )}
                    <Pill color={cTextColor(m.status)} bg={cBg(m.status)} size={7}>{m.status}</Pill>
                    {editMode ? <EditBadge onClick={() => openEdit('meeting', m)} /> : <span style={{ color:T.text3, fontSize:14 }}>›</span>}
                  </div>
                </div>
              ))}
            </div>
          )}

          {meetingTab === 'past' && (
            <div>
              {pastMeetings.length === 0 && (
                <div style={{ fontFamily:T.sans, fontSize:12, color:T.text3, padding:'16px 0' }}>No past meetings yet.</div>
              )}
              {(showAllPast ? pastMeetings : pastMeetings.slice(0, 3)).map((m, i, arr) => (
                <div key={m.id} className="edit-row accordion-row"
                  onClick={() => !editMode && setActiveMeeting(m)}
                  style={{
                    display:'flex', gap:16, alignItems:'center', padding:'12px 0',
                    borderBottom: i < arr.length - 1 ? `1px solid ${T.borderHair}` : 'none',
                    cursor: editMode ? 'default' : 'pointer',
                    opacity:0.65,
                  }}
                  onMouseEnter={e=>{ e.currentTarget.style.opacity='0.9'; if(!editMode) e.currentTarget.style.background=T.bgAlt; }}
                  onMouseLeave={e=>{ e.currentTarget.style.opacity='0.65'; e.currentTarget.style.background='transparent'; }}>
                  <div style={{ flexShrink:0, width:36, textAlign:'center' }}>
                    <div style={{ fontFamily:T.serif, fontSize:15, fontWeight:500, color:T.text3, lineHeight:1 }}>{pd(m.date).getDate()}</div>
                    <div style={{ fontFamily:T.sans, fontSize:7, color:T.text3, textTransform:'uppercase', letterSpacing:'0.08em', marginTop:2 }}>{pd(m.date).toLocaleString('en',{month:'short'})}</div>
                  </div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontFamily:T.sans, fontSize:12, fontWeight:500, color:T.text2 }}>{m.title}</div>
                    <div style={{ fontFamily:T.sans, fontSize:9, color:T.text3, marginTop:2 }}>{m.type}</div>
                  </div>
                  <div style={{ display:'flex', gap:8, alignItems:'center', flexShrink:0 }}>
                    {editMode ? <EditBadge onClick={() => openEdit('meeting', m)} /> : <span style={{ fontFamily:T.sans, fontSize:9, color:T.text3 }}>View notes ›</span>}
                  </div>
                </div>
              ))}
              {!showAllPast && pastMeetings.length > 3 && (
                <button onClick={() => setShowAllPast(true)}
                  style={{ background:'none', border:'none', cursor:'pointer', fontFamily:T.sans, fontSize:9, color:T.accent, padding:'12px 0', letterSpacing:'0.04em' }}>
                  Show all ({pastMeetings.length}) →
                </button>
              )}
            </div>
          )}
        </section>

        {/* ════════════════════════════════
            DELIVERABLES (id="deliverables")
        ════════════════════════════════ */}
        <section id="deliverables" style={{ paddingTop:48, paddingBottom:48, borderBottom:`1px solid ${T.borderHair}` }}>
          {(() => {
            const totalDone = deliverables.filter(d=>getStatusGroup(d.status)==='done').length;
            const totalAll  = deliverables.length;
            const overallPct = totalAll > 0 ? Math.round((totalDone/totalAll)*100) : 0;
            return (
              <>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:10 }}>
                  <div style={{ fontFamily:T.sans, fontSize:8, fontWeight:700, letterSpacing:'0.22em', textTransform:'uppercase', color:T.text3 }}>Deliverables</div>
                  <div style={{ display:'flex', gap:10, alignItems:'center' }}>
                    <span style={{ fontFamily:T.sans, fontSize:9, color:T.text3 }}>{totalDone} of {totalAll} complete</span>
                    {editMode && <button className="add-btn" style={{ border:`1px dashed ${T.accent}70`, color:T.accent, padding:'5px 12px', marginTop:0 }} onClick={() => openAdd('deliverable', { name:'', phase: phases[0]?.name||'', status:'Not Started', due:'', description:'' })}>+ Add</button>}
                  </div>
                </div>
                {/* Segmented milestone progress bar */}
                <div style={{ marginBottom:28 }}>
                  {/* Bar segments */}
                  <div style={{ display:'flex', gap:3, height:6, marginBottom:8 }}>
                    {phaseGroupOrder.map((phaseName, i) => {
                      const grpItems = phaseGroupMap[phaseName] || [];
                      const grpDone  = grpItems.filter(d => getStatusGroup(d.status) === 'done').length;
                      const grpPct   = grpItems.length > 0 ? grpDone / grpItems.length : 0;
                      const segWeight = grpItems.length / totalAll;
                      const isFirst = i === 0;
                      const isLast  = i === phaseGroupOrder.length - 1;
                      const fillColor = grpPct === 1 ? T.complete : T.accent;
                      return (
                        <div key={phaseName} style={{ flex: segWeight, position:'relative', background:T.bgAlt, borderRadius: isFirst ? '3px 0 0 3px' : isLast ? '0 3px 3px 0' : 0, overflow:'hidden' }}>
                          <div style={{ position:'absolute', inset:0, width:`${grpPct*100}%`, background:fillColor, transition:'width 0.5s ease', borderRadius:'inherit' }} />
                        </div>
                      );
                    })}
                  </div>
                  {/* Milestone labels below each segment */}
                  <div style={{ display:'flex', gap:3 }}>
                    {phaseGroupOrder.map(phaseName => {
                      const grpItems = phaseGroupMap[phaseName] || [];
                      const grpDone  = grpItems.filter(d => getStatusGroup(d.status) === 'done').length;
                      const segWeight = grpItems.length / totalAll;
                      const shortName = PHASE_SHORT[phaseName] || phaseName || 'Deliverables';
                      return (
                        <div key={phaseName} style={{ flex: segWeight, display:'flex', flexDirection:'column', gap:1 }}>
                          <div style={{ fontFamily:T.sans, fontSize:7, fontWeight:600, color:T.text3, letterSpacing:'0.04em', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{shortName}</div>
                          <div style={{ fontFamily:T.sans, fontSize:7, color:T.text3, opacity:0.7 }}>{grpDone}/{grpItems.length}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </>
            );
          })()}

          {editMode && (
            <div style={{ marginBottom:14, padding:'8px 12px', background:T.bgAlt, borderRadius:4 }}>
              <span style={{ fontFamily:T.sans, fontSize:9, color:T.text3 }}>✏ Click a status dot to advance · Use edit button for full control</span>
            </div>
          )}

          {/* Phase accordion groups */}
          {phaseGroupOrder.map(phaseName => {
            const items = phaseGroupMap[phaseName];
            const doneCount = items.filter(d => getStatusGroup(d.status) === 'done').length;
            const isOpen = openGroups[phaseName] === true;
            const shortName = PHASE_SHORT[phaseName] || phaseName || 'Deliverables';
            const completionRatio = items.length > 0 ? doneCount / items.length : 0;

            return (
              <div key={phaseName} style={{ marginBottom:4 }}>
                {/* Accordion header */}
                <div className="accordion-row"
                  onClick={() => toggleGroup(phaseName)}
                  style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 0', cursor:'pointer', borderBottom:`1px solid ${T.borderHair}` }}
                  onMouseEnter={e=>e.currentTarget.style.background=T.bgAlt}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <div style={{ flex:1, display:'flex', alignItems:'center', gap:14 }}>
                    <div style={{ fontFamily:T.sans, fontSize:10, fontWeight:600, color:T.text1 }}>{shortName}</div>
                    {/* Progress bar + count */}
                    <div style={{ display:'flex', alignItems:'center', gap:8, flexShrink:0 }}>
                      <div style={{ width:80, height:4, background:T.bgAlt, borderRadius:2, overflow:'hidden' }}>
                        <div style={{ height:'100%', width:`${completionRatio*100}%`, background:completionRatio === 1 ? T.complete : T.accent, borderRadius:2, transition:'width 0.5s ease' }} />
                      </div>
                      <span style={{ fontFamily:T.sans, fontSize:8, fontWeight:600, color:completionRatio===1?T.complete:T.text3, minWidth:28 }}>
                        {doneCount}/{items.length}
                      </span>
                    </div>
                  </div>
                  <span style={{ color:T.text3, fontSize:12, transform:isOpen?'rotate(90deg)':'none', transition:'transform 0.2s', display:'inline-block' }}>›</span>
                </div>

                {/* Accordion body */}
                {isOpen && items.map((d, i) => {
                  const group    = getStatusGroup(d.status);
                  const dotColor = DELIVERABLE_GROUPS[group].color;
                  const globalIdx = deliverables.findIndex(x => x.id === d.id);
                  return (
                    <div key={d.id} className="edit-row" style={{ display:'flex', gap:12, padding:'12px 0 12px 16px', borderBottom: i < items.length - 1 ? `1px solid ${T.borderHair}` : 'none' }}>
                      {/* Status dot */}
                      <div style={{ flexShrink:0, paddingTop:3 }}>
                        <div
                          onClick={() => editMode && cycleStatus(d)}
                          title={editMode ? `Click to advance: ${d.status}` : d.status}
                          style={{ width:10, height:10, borderRadius:'50%', background:dotColor, opacity:group==='notstarted'?0.25:1, cursor:editMode?'pointer':'default', transition:'background 0.3s', boxShadow:editMode?`0 0 0 2px ${dotColor}30`:'none' }} />
                      </div>
                      <div style={{ flex:1 }}>
                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:12 }}>
                          <div style={{ flex:1 }}>
                            <div style={{ fontFamily:T.sans, fontSize:12, fontWeight:600, color:group==='done'?T.text3:T.text1, textDecoration:group==='done'?'line-through':'none', marginBottom:2 }}>{d.name}</div>
                          </div>
                          <div style={{ display:'flex', gap:6, alignItems:'center', flexShrink:0 }}>
                            <Pill color={dotColor} bg={cBg(d.status)} size={7}>{d.status}</Pill>
                            {editMode && (
                              <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
                                <button onClick={() => moveDeliverable(d.id, 'up')} disabled={globalIdx===0}
                                  style={{ background:'none', border:`1px solid ${T.border}`, borderRadius:2, width:16, height:16, cursor:globalIdx===0?'default':'pointer', color:globalIdx===0?T.text3:T.text2, fontSize:8, lineHeight:1, opacity:globalIdx===0?0.3:1, display:'flex', alignItems:'center', justifyContent:'center' }}>↑</button>
                                <button onClick={() => moveDeliverable(d.id, 'down')} disabled={globalIdx===deliverables.length-1}
                                  style={{ background:'none', border:`1px solid ${T.border}`, borderRadius:2, width:16, height:16, cursor:globalIdx===deliverables.length-1?'default':'pointer', color:globalIdx===deliverables.length-1?T.text3:T.text2, fontSize:8, lineHeight:1, opacity:globalIdx===deliverables.length-1?0.3:1, display:'flex', alignItems:'center', justifyContent:'center' }}>↓</button>
                              </div>
                            )}
                            {editMode && <EditBadge onClick={() => openEdit('deliverable', d)} />}
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </section>


        {/* ════════════════════════════════
            FILES (id="files")
        ════════════════════════════════ */}
        <section id="files" style={{ paddingTop:48, paddingBottom:48 }}>
          <div style={{ fontFamily:T.sans, fontSize:8, fontWeight:700, letterSpacing:'0.22em', textTransform:'uppercase', color:T.text3, marginBottom:24 }}>Files &amp; Links</div>
          <div style={{ display:'flex', flexDirection:'column', gap:24 }}>
            {links.map(folder => (
              <div key={folder.id}>
                <div style={{ fontFamily:T.sans, fontSize:10, fontWeight:600, color:T.text2, marginBottom:10, display:'flex', alignItems:'center', gap:8 }}>
                  <span>📁</span>
                  <span>{folder.label}</span>
                </div>
                <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                  {folder.subFolders.map(sf => (
                    <div key={sf.id} className="edit-row" style={{ display:'flex', alignItems:'center', gap:4 }}>
                      <a href={sf.url} target="_blank" rel="noopener noreferrer"
                        style={{ display:'flex', alignItems:'center', gap:6, padding:'7px 13px', background:'none', border:`1px solid ${T.border}`, borderRadius:4, textDecoration:'none', transition:'all 0.15s', color:T.text1 }}
                        onMouseEnter={e=>{ e.currentTarget.style.borderColor=T.accent; e.currentTarget.style.background=T.accentBg; e.currentTarget.style.color=T.accent; }}
                        onMouseLeave={e=>{ e.currentTarget.style.borderColor=T.border; e.currentTarget.style.background='none'; e.currentTarget.style.color=T.text1; }}>
                        <span style={{ fontSize:12 }}>{sf.icon}</span>
                        <span style={{ fontFamily:T.sans, fontSize:11, fontWeight:500 }}>{sf.label}</span>
                      </a>
                      {editMode && <EditBadge onClick={() => setEditModal({ type:'link', item:{ ...sf, _folderId: folder.id }, isNew:false })} />}
                    </div>
                  ))}
                  {editMode && <button className="add-btn" style={{ border:`1px dashed ${T.accent}70`, color:T.accent, padding:'5px 12px', marginTop:0 }} onClick={() => setEditModal({ type:'link', item:{ icon:'📄', label:'', url:'', _folderId: folder.id }, isNew:true })}>+ Add Link</button>}
                </div>
              </div>
            ))}
          </div>
        </section>

      </div>

      {/* ════════════════════════════════
          FOOTER
      ════════════════════════════════ */}
      <div style={{ borderTop:`1px solid ${T.borderHair}`, padding:'20px 24px', textAlign:'center' }}>
        <div style={{ fontFamily:T.sans, fontSize:8, color:T.text3, letterSpacing:'0.12em' }}>
          The Space at 9/2 · Ritika Barmecha · Confidential
        </div>
      </div>

      {/* ════════════════════════════════
          MODALS
      ════════════════════════════════ */}
      {showPasscode && (
        <div style={{ position:'fixed', inset:0, zIndex:400, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(26,25,23,0.55)', backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)' }}
          onClick={() => { setShowPasscode(false); setPasscodeVal(''); setPasscodeErr(false); }}>
          <div style={{ background:T.surface, borderRadius:10, padding:'36px 40px', width:320, boxShadow:'0 24px 64px rgba(0,0,0,0.22)', border:`1px solid ${T.border}` }}
            onClick={e => e.stopPropagation()}>
            <div style={{ fontFamily:T.serif, fontSize:18, fontWeight:500, color:T.text1, marginBottom:6 }}>Edit Access</div>
            <div style={{ fontFamily:T.sans, fontSize:11, color:T.text3, marginBottom:24 }}>Enter the passcode to enable editing.</div>
            <input
              type="password"
              autoFocus
              value={passcodeVal}
              onChange={e => { setPasscodeVal(e.target.value); setPasscodeErr(false); }}
              onKeyDown={e => e.key === 'Enter' && submitPasscode()}
              placeholder="Passcode"
              style={{ width:'100%', padding:'10px 14px', borderRadius:6, border:`1.5px solid ${passcodeErr ? '#B24B43' : T.border}`, background:T.bg, color:T.text1, fontFamily:T.sans, fontSize:13, outline:'none', marginBottom: passcodeErr ? 6 : 16, boxSizing:'border-box' }}
            />
            {passcodeErr && <div style={{ fontFamily:T.sans, fontSize:10, color:'#B24B43', marginBottom:14 }}>Incorrect passcode. Try again.</div>}
            <div style={{ display:'flex', gap:10 }}>
              <button onClick={() => { setShowPasscode(false); setPasscodeVal(''); setPasscodeErr(false); }}
                style={{ flex:1, padding:'9px 0', borderRadius:6, border:`1px solid ${T.border}`, background:'none', color:T.text2, fontFamily:T.sans, fontSize:11, fontWeight:600, cursor:'pointer' }}>
                Cancel
              </button>
              <button onClick={submitPasscode}
                style={{ flex:1, padding:'9px 0', borderRadius:6, border:'none', background:T.accent, color:'#fff', fontFamily:T.sans, fontSize:11, fontWeight:700, cursor:'pointer', letterSpacing:'0.04em' }}>
                Enter
              </button>
            </div>
          </div>
        </div>
      )}
      {activeMeeting && <MeetingViewModal meeting={activeMeeting} onClose={() => setActiveMeeting(null)} team={team} />}
      {editModal && (
        <EditModal
          modal={editModal}
          phases={phases}
          deliverables={deliverables}
          meetings={meetings}
          presentations={effectivePresentations}
          deps={deps}
          onShiftDates={shiftPhaseDates}
          team={team}
          onClose={() => setEditModal(null)}
          onSave={saveEdit}
          onDelete={deleteEdit}
        />
      )}
    </div>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
